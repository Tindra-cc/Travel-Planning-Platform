# 容器内 nginx 站点配置（整体替换默认 default.conf，此文件被 include 在 http 块内）。
# 前端与接口同源（都经 80 端口），浏览器不触发跨域，后端 CORS 配置可忽略。

# WebSocket 升级头：对话流式走 /api/ws，缺了这段握手会失败
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history 模式：未命中的路径回退 index.html，否则刷新子路由 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口反代到 compose 内的 backend 服务（服务名即主机名）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 对话生成可能较久，放宽读超时
        proxy_read_timeout 300s;
    }
}
