version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-postgres
    environment:
      POSTGRES_DB: travel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: always

  backend:
    build: .
    container_name: travel-api
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      DB_PASSWORD: 1234
      REDIS_PASSWORD: ""
    restart: always

volumes:
  pgdata:
  redisdata:
