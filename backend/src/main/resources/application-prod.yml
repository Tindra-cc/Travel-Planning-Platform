# 生产环境
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/travel_db?stringtype=unspecified
    username: postgres
    password: ${DB_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  # 邮件：QQ 邮箱 SMTP 发送验证码（password 是授权码，非 QQ 密码）
  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_MAIL_USERNAME:}
    password: ${QQ_MAIL_AUTH_CODE:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  # 会话由 sa-token-redis-jackson 落 Redis（复用上面的 spring.data.redis 连接），服务重启后登录态不丢

# AI（DeepSeek）
# 生产环境不内置 key，必须由环境变量注入；未注入时 aiProperties.configured() 为 false，
# 意图分析自动降级为规则桩（见 IntentService.fallback），不会因缺 key 而 500。
ai:
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
    timeout: 60s
  dashscope:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen-plus
    timeout: 60s

logging:
  level:
    root: warn
    com.travel: info

# 跨域允许来源（生产通过环境变量 CORS_ALLOWED_ORIGINS 注入，逗号分隔）
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://travel.example.com}
  admin:
    # 运营接口白名单；未配置时仅 L3 用户可访问（FR-6/7/13）
    user-ids: ${ADMIN_USER_IDS:}
  expert:
    # 达人分成比例，由服务端写入发布记录，请求体不接受该字段
    commission-rate: ${EXPERT_COMMISSION_RATE:0.2}
  link:
    # 未注入时服务会使用进程内随机密钥并告警，重启后旧转链失效
    signing-secret: ${LINK_SIGNING_SECRET:}
  offline-pack:
    storage-dir: ${OFFLINE_PACK_DIR:/app/data/offline-packs}
    expire-hours: 72
  share:
    base-url: ${SHARE_BASE_URL:https://travel.example.com}
    expire-days: ${SHARE_EXPIRE_DAYS:30}
    qrcode-url-template: ${SHARE_QRCODE_URL_TEMPLATE:}
  travel-data:
    flight-price-url: ${FLIGHT_PRICE_URL:}
    hotel-price-url: ${HOTEL_PRICE_URL:}
    price-token: ${PRICE_SOURCE_TOKEN:}
    # SerpAPI：一个 key 覆盖 Google News / Flights / Hotels；留空则对应源标记 unavailable
    serp-api-key: ${SERPAPI_KEY:}
    serp-api-url: ${SERPAPI_URL:https://serpapi.com/search.json}
    timeout-seconds: 4
  trip-companion:
    scheduling-enabled: ${TRIP_COMPANION_SCHEDULING:true}
    scan-cron: "${TRIP_COMPANION_SCAN_CRON:0 */15 * * * *}"
