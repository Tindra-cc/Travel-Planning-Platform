# 生产环境
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/travel_db?stringtype=unspecified
    username: postgres
    password: ${DB_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  # 邮件：QQ 邮箱 SMTP 发送验证码（password 是授权码，非 QQ 密码）
  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_MAIL_USERNAME:}
    password: ${QQ_MAIL_AUTH_CODE:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  # 会话由 sa-token-redis-jackson 落 Redis（复用上面的 spring.data.redis 连接），服务重启后登录态不丢

# AI（DeepSeek，key 通过环境变量 DEEPSEEK_API_KEY 注入）
ai:
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
    timeout: 60s

logging:
  level:
    root: warn
    com.travel: info

# 跨域允许来源（生产通过环境变量 CORS_ALLOWED_ORIGINS 注入，逗号分隔）
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://travel.example.com}
