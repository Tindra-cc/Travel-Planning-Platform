# 生产环境
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/travel_db
    username: postgres
    password: ${DB_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sa-token:
  token-name: Authorization
  timeout: 86400

logging:
  level:
    root: warn
    com.travel: info

# 跨域允许来源（生产通过环境变量 CORS_ALLOWED_ORIGINS 注入，逗号分隔）
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://travel.example.com}
