#开发环境
# 开发环境
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/travel_db?stringtype=unspecified
    username: postgres
    password: 1234
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  # 邮件：QQ 邮箱 SMTP 发送验证码（password 是授权码，非 QQ 密码；未配置则回退 dev 回显）
  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_MAIL_USERNAME:}
    password: ${QQ_MAIL_AUTH_CODE:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory

# actuator健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Sa-Token
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  # 会话由 sa-token-redis-jackson 落 Redis（复用上面的 spring.data.redis 连接），服务重启后登录态不丢

# AI（DeepSeek，key 通过环境变量 DEEPSEEK_API_KEY 注入）
ai:
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
    timeout: 60s

# 日志
logging:
  level:
    root: info
    com.travel: debug

# 跨域允许来源（逗号分隔）
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

