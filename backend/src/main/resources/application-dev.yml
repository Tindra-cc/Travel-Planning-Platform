#开发环境
# 开发环境
spring:
  # 本地开发密钥来自 application-dev-local.yml（该文件不入库，见 backend/.gitignore）。
  # 注意：被导入文件的优先级低于声明它的文件，所以 api-key 不能在本文件再写一遍，否则会覆盖成空值。
  config:
    import: optional:classpath:application-dev-local.yml
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/travel_db?stringtype=unspecified
    username: postgres
    password: 1234
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  # 邮件：QQ 邮箱 SMTP 发送验证码（password 是授权码，非 QQ 密码；未配置则回退 dev 回显）
  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_MAIL_USERNAME:}
    password: ${QQ_MAIL_AUTH_CODE:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory

# actuator健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Sa-Token
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  # 会话由 sa-token-redis-jackson 落 Redis（复用上面的 spring.data.redis 连接），服务重启后登录态不丢

# AI（DeepSeek）
# 开发环境的 key 放在 application-dev-local.yml（不入库），该文件内以 ${DEEPSEEK_API_KEY:...}
# 形式书写，故环境变量仍可覆盖。文件缺失时 api-key 为空 → IntentService 自动降级为规则桩。
# 生产环境（application-prod.yml）不引入该文件，只认环境变量注入。
ai:
  deepseek:
    base-url: https://api.deepseek.com
    model: deepseek-chat
    timeout: 60s
  # 通义千问：DeepSeek 失败后的兜底模型；不配 key 时跳过，不影响生成（最终还有模板降级）
  dashscope:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen-plus
    timeout: 60s

# 日志
logging:
  level:
    root: info
    com.travel: debug

# 开发环境打印执行的 SQL；生产环境不打印（见 application.yaml 说明）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 跨域允许来源（逗号分隔）
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

